<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>உயிர் · மெய் · எண்கள் — Tamil for Kids</title>
  <meta name="description" content="A simple, colorful, kawaii app for kids to learn Tamil vowels, consonants and numbers — with pictures, animation and pronunciation." />
  <meta name="theme-color" content="#ffd6e8" />
  <meta property="og:title" content="Tamil Letters & Numbers for Kids" />
  <meta property="og:description" content="Learn Tamil உயிர், மெய் எழுத்துக்கள் and எண்கள் with cute pastel pictures." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
  <header class="appbar">
    <div class="brand"><span class="logo">🌸</span><span class="brand-name">தமிழ்</span></div>
    <div class="actions">
      <span id="stars" class="stars" title="Stars earned">⭐ 0</span>
      <button id="quiz" class="iconbtn" aria-label="Games">🎮</button>
      <button id="shuffle" class="iconbtn" aria-label="Shuffle order">🔀</button>
      <button id="repeat" class="iconbtn" aria-label="Repeat one">🔂</button>
      <button id="roman" class="iconbtn on" aria-label="Toggle romanization">ABC</button>
      <button id="sound" class="iconbtn" aria-label="Mute">🔊</button>
    </div>
  </header>

  <nav class="tabbar">
    <button class="tab active" data-set="uyir">உயிர்</button>
    <button class="tab" data-set="mey">மெய்</button>
    <button class="tab" data-set="numbers">எண்கள்</button>
    <button class="tab" data-set="uyirmey_ka">உயிர்மெய் (க)</button>
  </nav>

  <main id="stage" class="stage"><!-- card / quiz injected by app.js --></main>

  <div class="strip" id="strip"></div>

  <div class="controls">
    <button id="prev" class="ctrl" aria-label="Previous">⟨</button>
    <button id="play" class="ctrl play" aria-label="Play or Pause">⏸</button>
    <button id="next" class="ctrl" aria-label="Next">⟩</button>
  </div>

  <div id="splash" class="splash">
    <div class="splash-box">
      <div class="splash-emoji">🌸</div>
      <div class="splash-title">தமிழ் கற்போம்!</div>
      <div class="splash-sub">Tap to start 🔊</div>
    </div>
  </div>

  <script src="art.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
