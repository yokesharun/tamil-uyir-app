<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>உயிர் · மெய் · எண்கள் — Tamil for Kids</title>
  <meta name="description" content="A simple, colorful, kawaii app for kids to learn Tamil vowels, consonants and numbers — with pictures, animation and pronunciation." />
  <meta name="theme-color" content="#ffd6e8" />
  <meta property="og:title" content="Tamil Letters & Numbers for Kids" />
  <meta property="og:description" content="Learn Tamil உயிர், மெய் எழுத்துக்கள் and எண்கள் with cute pastel pictures." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <nav class="menu">
    <span class="logo">🌸</span>
    <div class="tabs">
      <button class="tab active" data-set="uyir">உயிர் எழுத்துக்கள்</button>
      <button class="tab" data-set="mey">மெய் எழுத்துக்கள்</button>
      <button class="tab" data-set="numbers">எண்கள்</button>
      <button class="tab" data-set="uyirmey_ka">உயிர்மெய் (க)</button>
    </div>
    <div class="toggles">
      <span id="stars" class="stars" title="Stars earned">⭐ 0</span>
      <button id="quiz" class="toggle" aria-label="Quiz game">🎮</button>
      <button id="shuffle" class="toggle" aria-label="Shuffle order">🔀</button>
      <button id="repeat" class="toggle" aria-label="Repeat one">🔂</button>
      <button id="roman" class="toggle on" aria-label="Toggle romanization">ABC</button>
      <button id="sound" class="toggle" aria-label="Mute">🔊</button>
    </div>
  </nav>

  <div id="banner" class="banner" hidden>
    <span>இந்த சாதனத்தில் "Samantha" குரல் இல்லை — படங்கள் வேலை செய்யும் 🌸 <em>(The "Samantha" voice isn't on this device — pictures still work.)</em></span>
    <button id="banner-close" aria-label="Dismiss">✕</button>
  </div>

  <main id="stage" class="stage"><!-- card / quiz injected by app.js --></main>

  <div class="strip" id="strip"></div>

  <div class="controls">
    <button id="prev" class="ctrl" aria-label="Previous">⟨</button>
    <button id="play" class="ctrl play" aria-label="Play or Pause">⏸</button>
    <button id="next" class="ctrl" aria-label="Next">⟩</button>
  </div>

  <div id="splash" class="splash">
    <div class="splash-box">
      <div class="splash-emoji">🌸</div>
      <div class="splash-title">தமிழ் கற்போம்!</div>
      <div class="splash-sub">Tap to start 🔊</div>
    </div>
  </div>

  <script src="art.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
